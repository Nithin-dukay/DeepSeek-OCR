# DeepSeek-OCR Configuration
# Optimized parameters to prevent repetition loops in historical documents

# Default generation parameters
generation:
  max_new_tokens: 4096
  temperature: 0.0  # Greedy decoding for deterministic output
  top_p: 1.0
  do_sample: false
  
  # Anti-repetition guardrails
  repetition_penalty: 1.2  # Penalize repeated tokens
  no_repeat_ngram_size: 10  # Prevent 10-gram repetition
  length_penalty: 1.0
  
  # Beam search (optional, set num_beams > 1 to enable)
  num_beams: 1
  early_stopping: true

# Aggressive anti-repetition (for problematic documents)
aggressive:
  max_new_tokens: 4096
  temperature: 0.0
  repetition_penalty: 1.5  # Stronger penalty
  no_repeat_ngram_size: 15  # Larger n-gram window
  length_penalty: 1.1
  num_beams: 3  # Use beam search
  early_stopping: true

# Historical newspaper-specific settings
newspaper:
  max_new_tokens: 8192  # Longer documents
  temperature: 0.0
  repetition_penalty: 1.3
  no_repeat_ngram_size: 12
  length_penalty: 1.05
  num_beams: 1
  early_stopping: true
  
  # Column splitting
  split_columns: true
  num_columns: 2

# Repetition detection thresholds
repetition_detection:
  enabled: true
  min_repeat_length: 50  # Minimum chars in repeated substring
  max_repeat_ratio: 0.3  # Max 30% of text can be repetition
  max_duplicate_lines_ratio: 0.5  # Max 50% duplicate lines

# Retry logic
retry:
  enabled: true
  max_retries: 2
  escalation:
    - repetition_penalty: 1.2
      no_repeat_ngram_size: 10
    - repetition_penalty: 1.5
      no_repeat_ngram_size: 15
    - repetition_penalty: 1.8
      no_repeat_ngram_size: 20

# Model settings
model:
  path: "deepseek-ai/deepseek-ocr"
  torch_dtype: "bfloat16"  # or "float16"
  device: "auto"  # "cuda", "cpu", or "auto"
  trust_remote_code: true

# Prompts
prompts:
  default: "Extract all text from the image, preserving layout and structure."
  newspaper: "Extract all text from this historical newspaper image. Preserve column layout, headlines, and article structure."
  handwritten: "Carefully transcribe all handwritten text from the image."
  table: "Extract the table data from the image, preserving rows and columns."
