<svg width="300" height="380" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="380" fill="#f5f5f5" rx="10"/>
  
  <!-- QR Code Placeholder -->
  <rect x="50" y="40" width="200" height="200" fill="#ffffff" stroke="#e0e0e0" stroke-width="2" rx="5"/>
  
  <!-- Grid pattern to simulate QR code -->
  <g opacity="0.3">
    <rect x="70" y="60" width="160" height="160" fill="none" stroke="#666666" stroke-width="1"/>
    <line x1="70" y1="100" x2="230" y2="100" stroke="#666666" stroke-width="1"/>
    <line x1="70" y1="140" x2="230" y2="140" stroke="#666666" stroke-width="1"/>
    <line x1="70" y1="180" x2="230" y2="180" stroke="#666666" stroke-width="1"/>
    <line x1="110" y1="60" x2="110" y2="220" stroke="#666666" stroke-width="1"/>
    <line x1="150" y1="60" x2="150" y2="220" stroke="#666666" stroke-width="1"/>
    <line x1="190" y1="60" x2="190" y2="220" stroke="#666666" stroke-width="1"/>
  </g>
  
  <!-- WeChat Icon -->
  <circle cx="150" cy="140" r="30" fill="#07C160" opacity="0.8"/>
  <text x="150" y="150" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle">微信</text>
  
  <!-- Title -->
  <text x="150" y="270" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333333" text-anchor="middle">DeepSeek-OCR 交流群</text>
  
  <!-- Subtitle -->
  <text x="150" y="295" font-family="Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle">扫码加入微信群</text>
  
  <!-- Expiration Notice -->
  <rect x="30" y="310" width="240" height="50" fill="#fff3cd" stroke="#ffc107" stroke-width="1" rx="5"/>
  <text x="150" y="330" font-family="Arial, sans-serif" font-size="12" fill="#856404" text-anchor="middle">⚠️ 二维码7天后过期</text>
  <text x="150" y="348" font-family="Arial, sans-serif" font-size="11" fill="#856404" text-anchor="middle">请及时更新或联系维护者</text>
</svg>
