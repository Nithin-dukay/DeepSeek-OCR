[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-ocr"
version = "1.0.0"
description = "DeepSeek-OCR: Contexts Optical Compression"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "DeepSeek AI", email = "support@deepseek.com"}
]
maintainers = [
    {name = "DeepSeek AI", email = "support@deepseek.com"}
]
keywords = ["deepseek", "ocr", "vision", "language-model", "multimodal", "ai", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "transformers==4.46.3",
    "tokenizers==0.20.3",
    "PyMuPDF",
    "img2pdf",
    "einops",
    "easydict",
    "addict",
    "Pillow",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
]
vllm = [
    "vllm>=0.8.5",
]
all = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
    "vllm>=0.8.5",
]

[project.urls]
Homepage = "https://github.com/deepseek-ai/DeepSeek-OCR"
Documentation = "https://github.com/deepseek-ai/DeepSeek-OCR"
Repository = "https://github.com/deepseek-ai/DeepSeek-OCR"
"Bug Tracker" = "https://github.com/deepseek-ai/DeepSeek-OCR/issues"
Paper = "https://arxiv.org/abs/2510.18234"

[tool.setuptools]
package-dir = {"" = "DeepSeek-OCR-master"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["DeepSeek-OCR-master"]

[tool.black]
line-length = 120
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=deepseek_ocr --cov-report=term-missing"
